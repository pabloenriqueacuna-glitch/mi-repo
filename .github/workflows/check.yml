name: Revisar README

on:
  pull_request:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que README.md existe y no está vacío
        run: |
          test -s README.md
          echo "README.md existe y tiene contenido"

      - name: Verificar que README tiene un título
        run: grep -q '^# ' README.md